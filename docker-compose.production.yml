services:
  ras-redis:
    image: redis:7-alpine
    container_name: ras-redis-production
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${RAS_REDIS_PASSWORD:?set RAS_REDIS_PASSWORD in .env.production}"]
    environment:
      RAS_REDIS_PASSWORD: ${RAS_REDIS_PASSWORD:?set RAS_REDIS_PASSWORD in .env.production}
    volumes:
      - ras-production-redis-data:/data
    networks:
      - ras-internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$RAS_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 3

  ras-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ras-deployment-kit:production
    container_name: ras-api-production
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 8080
      RAS_DB_PATH: /data/ras-store.json
      ZERNIO_MODE: ${ZERNIO_MODE:-dry-run}
      ZERNIO_BASE_URL: ${ZERNIO_BASE_URL:-https://zernio.com/api/v1}
      RAS_REDIS_URL: redis://:${RAS_REDIS_PASSWORD:?set RAS_REDIS_PASSWORD in .env.production}@ras-redis:6379/0
    volumes:
      - ras-production-data:/data
    networks:
      - default
      - ras-internal
    depends_on:
      ras-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RAS_API_PRODUCTION_PORT:-8093}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ras-worker:
    image: ras-deployment-kit:production
    container_name: ras-worker-production
    restart: unless-stopped
    command: ["node", "dist/apps/ras-worker/src/worker.js"]
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      RAS_DB_PATH: /data/ras-store.json
      ZERNIO_MODE: ${ZERNIO_MODE:-dry-run}
      ZERNIO_BASE_URL: ${ZERNIO_BASE_URL:-https://zernio.com/api/v1}
      RAS_WORKER_BATCH_SIZE: ${RAS_WORKER_BATCH_SIZE:-20}
      RAS_WORKER_IDLE_MS: ${RAS_WORKER_IDLE_MS:-5000}
      RAS_WORKER_MAX_RETRIES: ${RAS_WORKER_MAX_RETRIES:-5}
      RAS_WORKER_BASE_RETRY_MS: ${RAS_WORKER_BASE_RETRY_MS:-60000}
    volumes:
      - ras-production-data:/data
    depends_on:
      ras-api:
        condition: service_healthy

volumes:
  ras-production-data:
    external: true
    name: ras-deployment-kit_ras-data
  ras-production-redis-data:
    external: true
    name: ras-deployment-kit_ras-production-redis-data

networks:
  ras-internal:
    internal: true
